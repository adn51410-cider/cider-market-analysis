name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'

jobs:
  build:
    name: Build & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ESTAT_API_KEY: ${{ secrets.ESTAT_API_KEY }}

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run database tests
        run: npx tsx tests/integration/database.test.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Run e-Stat API tests
        run: npx tsx tests/integration/estatApi.test.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ESTAT_API_KEY: ${{ secrets.ESTAT_API_KEY }}

      - name: Run CSV import tests
        run: npx tsx tests/integration/csvImport.test.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build application
        run: npm run build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ESTAT_API_KEY: ${{ secrets.ESTAT_API_KEY }}

      - name: Run E2E tests
        run: npx playwright test --project=chromium
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ESTAT_API_KEY: ${{ secrets.ESTAT_API_KEY }}
          NEXT_PUBLIC_APP_URL: http://localhost:3247

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
